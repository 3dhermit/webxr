name: Deploy branch preview at /next/

# Why this exists: the classroom needs ONE stable URL (the site root, built from
# main) and the teacher needs to try the next version on a second headset without
# touching the first. GitHub Pages free tier has no per-branch preview sites, so
# this workflow deploys a COMBINED site: main at the root, the candidate branch
# under /next/. Both URLs are live at once, on the same site.
#
#   class version    https://<site>/
#   candidate        https://<site>/next/
#
# Both builds use relative asset paths (no webpack publicPath), so a subpath is
# safe. If absolute paths are ever introduced, this preview breaks first — that is
# intentional, it fails in CI rather than in a classroom.

on:
  push:
    branches: ['anatomy-vr']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deployment at a time for the whole repo (shares the group with
# deploy.yml, so a branch push can never race a main push mid-deploy).
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      # Lesson JSON is the content a teacher edits. A bad heart.json must never
      # reach 28 headsets, so the validator gates every deploy.
      - name: Validate lesson content
        run: npm run validate

      - name: Build candidate
        run: |
          npm ci
          npm run build

      - name: Stage candidate at /next/
        run: |
          mkdir -p site/next
          cp -r dist/. site/next/

      - uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - name: Build the classroom version from main
        working-directory: live
        run: |
          npm ci
          npm run build

      - name: Stage classroom version at the site root
        run: cp -r live/dist/. site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
