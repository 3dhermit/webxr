name: Build and deploy to Pages

on:
  # Runs on pushes to the classroom branch (which publishes) and the candidate branch
  # (which is only checked, never published — see the jobs below for why).
  push:
    branches: ['main', 'anatomy-vr']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize per branch. Only main publishes, so two runs can never race on the Pages
# artifact — and a candidate-branch check can no longer cancel a publish in flight
# (a shared group with cancel-in-progress did exactly that).
concurrency:
  group: 'pages-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  # A push to the candidate branch gets a genuine CI check (install, validate, build)
  # but NO publish. GitHub's auto-created `github-pages` environment refuses deployments
  # from any branch other than the default one, so a branch-triggered deploy fails in
  # seconds — and with cancel-in-progress it can cancel the main deploy too, silently
  # freezing the site at an older build. Publish rights belong to main; the candidate
  # branch proves itself in CI and reaches /next/ on the next publish from main.
  check-candidate:
    if: github.ref == 'refs/heads/anatomy-vr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Validate lesson content
        run: npm run validate
      - name: Build
        run: |
          npm ci
          npm run build

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      # Always publish BOTH copies in one artifact: main at the site root (the URL a
      # class uses) and the candidate branch under /next/, so a teacher can hold the
      # live lesson and the next version on two headsets and merge only what works.
      # The subpath works because webpack sets no publicPath and every asset loads
      # relatively — if absolute paths appear, /next/ breaks here, in CI, first.
      - name: Check out the classroom version (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: live

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: live/package-lock.json

      # Lesson JSON is student-facing content. Gate the deploy on it being coherent
      # with the geometry registry, or a typo in a prompt ships to a classroom.
      - name: Validate classroom lesson content
        working-directory: live
        run: npm run validate

      - name: Build classroom version
        working-directory: live
        run: |
          npm ci
          npm run build

      - name: Does a candidate branch exist?
        id: cand
        # Must run inside the checkout: the workspace root itself is not a git
        # repository, because every step below works in live/ or cand/.
        working-directory: live
        run: |
          if git ls-remote --exit-code --heads origin anatomy-vr >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the candidate branch
        if: steps.cand.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: anatomy-vr
          path: cand

      - name: Validate candidate lesson content
        if: steps.cand.outputs.exists == 'true'
        working-directory: cand
        run: npm run validate

      - name: Build candidate
        if: steps.cand.outputs.exists == 'true'
        working-directory: cand
        run: |
          npm ci
          npm run build

      - name: Assemble the site
        run: |
          mkdir -p site
          cp -r live/dist/. site/
          if [ '${{ steps.cand.outputs.exists }}' = 'true' ]; then
            mkdir -p site/next
            cp -r cand/dist/. site/next/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
