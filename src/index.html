<!doctype html>
<html lang="en">
	<head>
		<title>Heart &amp; Circulation — VR Lesson</title>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, user-scalable=no"
		/>
	</head>
	<body style="margin: 0">
		<!--
      Student mode shows nothing in the page itself: Quest Browser ignores DOM in immersive-vr,
      so every word lives in the 3D scene. This strip is only visible on a monitor, and it carries
      the attribution the lesson content requires.
    -->
		<div
			style="
				position: fixed;
				bottom: 6px;
				left: 8px;
				right: 8px;
				font: 11px/1.4 system-ui, sans-serif;
				color: #d7dee6;
				opacity: 0.75;
				pointer-events: auto;
			"
		>
			Anatomy model: HuBMAP Human Reference Atlas, “Reference organ — heart,
	male” (v1.3), CC&nbsp;BY&nbsp;4.0, UV-unwrapped and textured for this lesson · Text adapted from OpenStax
			<em>Anatomy and Physiology</em>, CC&nbsp;BY&nbsp;4.0 · Code:
			<a
				href="https://github.com/meta-quest/webxr-first-steps"
				style="color: #9fc6ef"
				>webxr-first-steps</a
			>&nbsp;(MIT)
		</div>
		<!-- No script tag here on purpose: HtmlWebpackPlugin injects index.bundle.js into this
		     template for both dev and build. The hand-written ./index.js tag this replaces only
		     ever resolved under the dev server, so on GitHub Pages every classroom load began
		     with a 404. -->
	</body>
</html>
